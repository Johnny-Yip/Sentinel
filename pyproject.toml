[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-repository-miner"
version = "0.4.0"
description = "Repository mining, feature engineering, and cross-project ML baselines for Sentinel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "GitPython>=3.1.43,<4",
    "joblib>=1.3,<2",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
sentinel-mine = "sentinel.mine:main"
sentinel-features = "sentinel.features:main"
sentinel-train = "sentinel.ml.cli:main"
sentinel-cross-project = "sentinel.cross_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
